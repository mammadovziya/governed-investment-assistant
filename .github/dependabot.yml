version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Baku
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: deps
      include: scope
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Baku
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Baku
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: docker
    ignore:
      # Node 22 is the project's declared and tested runtime baseline. Review
      # runtime-major migrations deliberately instead of opening automatic PRs.
      - dependency-name: node
        update-types:
          - version-update:semver-major
