name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run release:verify

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser and accessibility verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Build and retain no-push OCI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "true"
      DOCKER_BUILD_RECORD_RETENTION_DAYS: "30"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare retained container-evidence directory
        run: mkdir -p artifacts/container

      - name: Build OCI image with attached attestations
        id: container-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: governed-investment-assistant:${{ github.sha }}
          outputs: type=oci,dest=${{ github.workspace }}/artifacts/container/governed-investment-assistant-${{ github.sha }}.oci.tar
          provenance: mode=max
          sbom: true

      - name: Verify and record container evidence
        env:
          BUILD_METADATA: ${{ steps.container-build.outputs.metadata }}
          IMAGE_DIGEST: ${{ steps.container-build.outputs.digest }}
          OCI_ARCHIVE: ${{ github.workspace }}/artifacts/container/governed-investment-assistant-${{ github.sha }}.oci.tar
          EVIDENCE_DIRECTORY: ${{ github.workspace }}/artifacts/container
        shell: bash
        run: |
          set -euo pipefail
          test -s "${OCI_ARCHIVE}"
          test -n "${IMAGE_DIGEST}"
          printf '%s\n' "${BUILD_METADATA}" > "${EVIDENCE_DIRECTORY}/build-metadata.json"
          jq -e . "${EVIDENCE_DIRECTORY}/build-metadata.json" >/dev/null
          metadata_digest="$(
            jq -er '."containerimage.digest"' \
              "${EVIDENCE_DIRECTORY}/build-metadata.json"
          )"
          test "${metadata_digest}" = "${IMAGE_DIGEST}"
          layout_directory="${RUNNER_TEMP}/governed-investment-assistant-oci-layout"
          mkdir -p "${layout_directory}"
          tar -xf "${OCI_ARCHIVE}" -C "${layout_directory}"
          node scripts/collect-oci-attestations.mjs \
            "${layout_directory}" \
            "${EVIDENCE_DIRECTORY}/attestations" \
            "${IMAGE_DIGEST}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commitSha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg eventName "${GITHUB_EVENT_NAME}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg imageDigest "${IMAGE_DIGEST}" \
            '{
              schemaVersion: "governed-investment-assistant.container-build-evidence.v1",
              repository: $repository,
              commitSha: $commitSha,
              ref: $ref,
              eventName: $eventName,
              runId: $runId,
              runAttempt: $runAttempt,
              imageDigest: $imageDigest,
              registryPush: false,
              retentionDays: 30
            }' > "${EVIDENCE_DIRECTORY}/ci-context.json"
          (
            cd "${EVIDENCE_DIRECTORY}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload retained container evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-build-evidence-${{ github.sha }}
          path: artifacts/container
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
